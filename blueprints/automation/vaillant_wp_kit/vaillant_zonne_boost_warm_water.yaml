blueprint:
  name: "Vaillant WP – zonne-boost warm water"
  author: coolnr
  source_url: https://github.com/coolnr/vaillant-wp-kit/blob/main/blueprints/automation/vaillant_wp_kit/vaillant_zonne_boost_warm_water.yaml
  description: |
    **Doel:** zonne-overschot opslaan als warm water door de boiler-setpoint tijdelijk te verhogen, met zo min mogelijk compressorstarts. Het comfort blijft altijd bij de warmtepomp zelf; deze automation zet alleen de setpoint omhoog en weer terug.

    **Regels**
    1. **Verlengen:** laadt de WP al warm water en is er genoeg overschot, dan direct naar de boost-temperatuur. Kost geen extra start.
    2. **Nieuwe run:** WP staat stil, ruim overschot, boiler laag genoeg om echt te gaan laden (boost − laadhysterese − 1 °C marge), en vandaag nog niet geladen óf boiler flink gebruikt.
    3. **Terugzetten:** als het overschot weg is (15 min) of uiterlijk op de deadline, maar **nooit midden in een laadbeurt**. Een afgebroken run kost bij terugkerende zon een extra start.

    Slaat zichzelf over tijdens of vlak voor een legionella-cyclus (blueprint *Vaillant WP – legionella op zon*).

    **Belangrijk:** gebruik voor het overschot een netvermogen-sensor **zonder** het verbruik van de warmtepomp zelf (`sensor.wp_netvermogen_excl_warmtepomp` uit het package). Anders eet de draaiende compressor zijn eigen overschot op en ontstaan extra starts.

    Vereist: package `vaillant_wp.yaml`. Getest met aroTHERM plus + sensoCOMFORT (BASV3) via ebusd.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    entities:
      name: Entities
      icon: mdi:link-variant
      input:
        net_power:
          name: Netvermogen excl. warmtepomp (W)
          description: Afname positief, teruglevering negatief, zonder het WP-verbruik.
          default: sensor.wp_netvermogen_excl_warmtepomp
          selector:
            entity:
              filter:
                domain: sensor
                device_class: power
        wp_power:
          name: Elektrisch vermogen warmtepomp (W)
          default: sensor.wp_elektrisch_vermogen
          selector:
            entity:
              filter:
                domain: sensor
                device_class: power
        statuscode:
          name: WP statuscode (ebusd HMU RunDataStatuscode)
          selector:
            entity:
              filter:
                domain: sensor
        boiler_temp:
          name: Boilertemperatuur
          default: sensor.wp_boiler_temperatuur
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        boiler_setpoint:
          name: Boiler-setpoint (ebusd HwcTempDesired)
          description: Proefdraaien? Kies hier input_number.vaillant_wp_test_boiler_setpoint, dan stuurt de automation niets naar de warmtepomp.
          selector:
            entity:
              filter:
                domain: [number, input_number]
        laadtijd_vandaag:
          name: Boiler laadtijd vandaag (h)
          default: sensor.wp_boiler_laadtijd_vandaag
          selector:
            entity:
              filter:
                domain: sensor
        legionella_actief:
          name: Legionella-cyclus actief
          default: input_boolean.vaillant_wp_legionella_actief
          selector:
            entity:
              filter:
                domain: input_boolean
        laatste_legionella:
          name: Laatste legionella-cyclus
          default: input_datetime.vaillant_wp_laatste_legionella
          selector:
            entity:
              filter:
                domain: input_datetime
    temperaturen:
      name: Temperaturen
      icon: mdi:thermometer
      input:
        base_setpoint:
          name: Basis-setpoint (°C)
          description: Waar de boiler normaal op staat en naar terug wordt gezet.
          default: 38
          selector:
            number: {min: 30, max: 55, step: 1, unit_of_measurement: "°C"}
        boost_setpoint:
          name: Boost-setpoint (°C)
          default: 54
          selector:
            number: {min: 40, max: 65, step: 1, unit_of_measurement: "°C"}
        hysterese:
          name: Laadhysterese warmtepomp (K)
          description: De WP begint pas met laden als de boiler zoveel graden onder de setpoint zit (Vaillant standaard 5-7).
          default: 6
          selector:
            number: {min: 2, max: 10, step: 1, unit_of_measurement: K}
        gebruikt_grens:
          name: "'Flink gebruikt' onder (°C)"
          description: Na een laadbeurt alleen opnieuw boosten als de boiler hieronder is gezakt.
          default: 40
          selector:
            number: {min: 30, max: 55, step: 1, unit_of_measurement: "°C"}
    drempels:
      name: Overschot en tijden
      icon: mdi:solar-power-variant
      input:
        threshold_new:
          name: Overschot voor nieuwe run (W)
          default: 3000
          selector:
            number: {min: 500, max: 10000, step: 100, unit_of_measurement: W}
        threshold_extend:
          name: Overschot om een lopende run te verlengen (W)
          default: 1500
          selector:
            number: {min: 300, max: 10000, step: 100, unit_of_measurement: W}
        threshold_gone:
          name: Overschot 'weg' onder (W)
          default: 500
          selector:
            number: {min: 0, max: 5000, step: 100, unit_of_measurement: W}
        window_start:
          name: Start boostvenster
          description: Bij voorkeur gelijk aan het warmwater-laadvenster van de WP.
          default: "13:00:00"
          selector:
            time: {}
        window_end:
          name: Einde boostvenster
          default: "17:00:00"
          selector:
            time: {}
        reset_deadline:
          name: Uiterlijk terugzetten om
          default: "19:00:00"
          selector:
            time: {}
        legionella_dagen:
          name: Legionella aan de beurt vanaf dag
          description: Vanaf deze dag laat de boost de beurt aan de legionella-cyclus.
          default: 5
          selector:
            number: {min: 1, max: 14, step: 1}

mode: queued
max: 3

trigger_variables:
  net_power: !input net_power
  th_new: !input threshold_new
  th_extend: !input threshold_extend
  th_gone: !input threshold_gone

variables:
  wp_power: !input wp_power
  boiler_temp: !input boiler_temp
  boiler_setpoint: !input boiler_setpoint
  laadtijd: !input laadtijd_vandaag
  laatste_legionella: !input laatste_legionella
  base: !input base_setpoint
  boost: !input boost_setpoint
  hyst: !input hysterese
  gebruikt: !input gebruikt_grens
  leg_dagen: !input legionella_dagen

triggers:
  - id: nieuw
    trigger: template
    value_template: "{{ states(net_power) | float(0) <= -th_new }}"
    for: {minutes: 10}
  - id: verleng
    trigger: template
    value_template: "{{ states(net_power) | float(0) <= -th_extend }}"
    for: {minutes: 5}
  - id: laden_start
    trigger: state
    entity_id: !input statuscode
    to: [hwc_prerun, hwc_compressor_active]
  - id: compressor_draait
    # 6 min: de statuscode loopt soms minuten achter op het echte verbruik.
    trigger: numeric_state
    entity_id: !input wp_power
    above: 300
    for: {minutes: 6}
  - id: venster
    trigger: time
    at: !input window_start
  - id: overschot_weg
    trigger: template
    value_template: "{{ states(net_power) | float(0) > -th_gone }}"
    for: {minutes: 15}
  - id: deadline
    trigger: time
    at: !input reset_deadline
  - id: sessie_klaar
    # Laadbeurt afgelopen: alsnog terugzetten als een eerdere reset werd tegengehouden.
    trigger: numeric_state
    entity_id: !input wp_power
    below: 100
    for: {minutes: 2}

conditions:
  - condition: state
    entity_id: !input legionella_actief
    state: "off"

actions:
  - choose:
      - alias: Boost (verlengen of nieuwe run)
        conditions:
          - condition: trigger
            id: [nieuw, verleng, laden_start, compressor_draait, venster]
          - condition: time
            after: !input window_start
            before: !input window_end
          - alias: Setpoint staat nog niet op boost
            condition: template
            value_template: "{{ states(boiler_setpoint) | float(0) < boost }}"
          - alias: Legionella nog niet aan de beurt
            condition: template
            value_template: >
              {{ (now().timestamp() - (state_attr(laatste_legionella, 'timestamp') | float(0))) / 86400 < leg_dagen }}
        sequence:
          - choose:
              - alias: "Verlengen: compressor laadt echt warm water"
                conditions:
                  - condition: numeric_state
                    entity_id: !input wp_power
                    above: 300
                  - condition: state
                    entity_id: !input statuscode
                    state: [hwc_prerun, hwc_compressor_active]
                  - condition: template
                    value_template: >
                      {{ states(boiler_temp) | float(99) < boost
                         and states(net_power) | float(0) <= -th_extend }}
                sequence:
                  - action: "{{ boiler_setpoint.split('.')[0] }}.set_value"
                    target: {entity_id: !input boiler_setpoint}
                    data: {value: "{{ boost }}"}
                  - action: logbook.log
                    data:
                      name: Vaillant WP-kit
                      message: "Zonne-boost: setpoint naar {{ boost }} °C ({{ trigger.id }})"
                      entity_id: !input boiler_setpoint
              - alias: "Nieuwe run: WP stil, ruim overschot, boiler laag genoeg"
                conditions:
                  - condition: numeric_state
                    entity_id: !input wp_power
                    below: 300
                  - condition: template
                    value_template: >
                      {% set t = states(boiler_temp) | float(99) %}
                      {{ states(net_power) | float(0) <= -th_new
                         and t < boost - hyst - 1
                         and (states(laadtijd) | float(0) < 0.05 or t < gebruikt) }}
                sequence:
                  - action: "{{ boiler_setpoint.split('.')[0] }}.set_value"
                    target: {entity_id: !input boiler_setpoint}
                    data: {value: "{{ boost }}"}
                  - action: logbook.log
                    data:
                      name: Vaillant WP-kit
                      message: "Zonne-boost: setpoint naar {{ boost }} °C ({{ trigger.id }})"
                      entity_id: !input boiler_setpoint
      - alias: Terugzetten naar basis-setpoint
        conditions:
          - condition: trigger
            id: [overschot_weg, deadline, sessie_klaar]
          - condition: template
            value_template: "{{ states(boiler_setpoint) | float(0) > base }}"
          - alias: Nooit midden in een laadbeurt
            condition: not
            conditions:
              - condition: numeric_state
                entity_id: !input wp_power
                above: 300
          - alias: Geen valse 'sessie klaar' na herstart of eBUS-blip
            condition: template
            value_template: >
              {{ trigger.id != 'sessie_klaar'
                 or (trigger.from_state is not none and is_number(trigger.from_state.state)) }}
        sequence:
          - action: "{{ boiler_setpoint.split('.')[0] }}.set_value"
            target: {entity_id: !input boiler_setpoint}
            data: {value: "{{ base }}"}
          - action: logbook.log
            data:
              name: Vaillant WP-kit
              message: "Zonne-boost: setpoint terug naar {{ base }} °C ({{ trigger.id }})"
              entity_id: !input boiler_setpoint
